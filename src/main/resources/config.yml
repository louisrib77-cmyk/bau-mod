web:
  # Eigener Port des Plugins. NICHT 8100 (BlueMap) und nicht 8101.
  port: 8200
  # 0.0.0.0 = erreichbar ueber localhost UND die Tailscale-IP.
  # 127.0.0.1 = nur lokal auf dem Server-Laptop.
  bind: "0.0.0.0"
  # Optional: Zugriffstoken. Leer = kein Schutz.
  # Aufruf dann mit http://IP:8200/?token=DEIN_TOKEN
  token: ""
